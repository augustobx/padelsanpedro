<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sin conexión — Padel San Pedro</title>
  <meta name="theme-color" content="#020617">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020617;
      color: #f8fafc;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #0f172a;
      border-radius: 1.5rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      border: 1px solid #1e293b;
      padding: 40px 28px;
      text-align: center;
    }
    .icon-box {
      width: 80px;
      height: 80px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .icon-box svg {
      width: 40px;
      height: 40px;
      stroke: #10b981;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      width: 100%;
      background: #10b981;
      color: #020617;
      font-weight: 800;
      padding: 14px 20px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.3);
      transition: all 0.2s;
    }
    .btn:hover { background: #34d399; }
    .btn:active { transform: scale(0.98); }
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Sin conexión a internet</h1>
    <p>No te preocupes: tus reservas y datos siguen a salvo. Cuando vuelva la señal o Wi-Fi, tocá el botón para reanudar al instante.</p>
    <button class="btn" onclick="window.location.reload()">
      Reintentar conexión
    </button>
    <div class="footer">Padel San Pedro • App Pro</div>
  </div>
</body>
</html>
