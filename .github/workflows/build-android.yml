name: Build Android App (Padel San Pedro)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilación'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'apk_debug'
          - 'bundle_release'
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build-android:
    name: Compilar APK y AAB de Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 4. Instalar dependencias npm
        run: npm ci

      - name: 5. Sincronizar Capacitor Android
        run: npx cap sync android

      - name: 6. Permisos de ejecución para Gradlew
        run: chmod +x android/gradlew

      - name: 7. Compilar APK (Instalable directo para Android)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 8. Compilar AAB (Bundle para Google Play Store)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon || echo "Release bundle opcional sin firma"

      - name: 9. Renombrar APK con nombre amigable
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/PadelSanPedro-v1.0-debug.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab build-artifacts/PadelSanPedro-v1.0-release.aab
          fi

      - name: 10. Subir APK instalable como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PadelSanPedro-Android-APK
          path: build-artifacts/PadelSanPedro-v1.0-debug.apk
          retention-days: 30

      - name: 11. Subir AAB para Google Play si existe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PadelSanPedro-GooglePlay-AAB
          path: build-artifacts/*.aab
          if-no-files-found: ignore
          retention-days: 30
