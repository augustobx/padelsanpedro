name: Build Android App (Padel San Pedro)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilación'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'apk_debug'
          - 'bundle_release'
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/build-android.yml'
      - 'package.json'

permissions:
  contents: write

jobs:
  build-android:
    name: Compilar APK y AAB de Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 4. Instalar dependencias npm
        run: npm ci

      - name: 5. Sincronizar Capacitor Android
        run: npx cap sync android

      - name: 6. Permisos de ejecución para Gradlew
        run: chmod +x android/gradlew

      - name: 7. Configurar versión dinámica
        id: versioning
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="1.0.${BUILD_NUM}"
          VERSION_CODE=$((100 + BUILD_NUM))
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "## 🚀 Compilación Android v${VERSION_NAME} (Build Code ${VERSION_CODE})" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Name:** \`${VERSION_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Code:** \`${VERSION_CODE}\`" >> $GITHUB_STEP_SUMMARY

      - name: 8. Compilar APK (Instalable directo para Android)
        id: gradle_build
        run: |
          cd android
          ./gradlew assembleDebug -PversionCode=${{ env.VERSION_CODE }} -PversionName="${{ env.VERSION_NAME }}" --stacktrace 2>&1 | tee ../gradle_build.log

      - name: Mostrar log si falla en el resumen
        if: failure()
        run: |
          echo "## ❌ Error de compilación en Gradle" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 100 gradle_build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 9. Compilar AAB (Bundle para Google Play Store)
        run: |
          cd android
          ./gradlew bundleRelease -PversionCode=${{ env.VERSION_CODE }} -PversionName="${{ env.VERSION_NAME }}" || echo "Release bundle opcional sin firma"

      - name: 10. Preparar artefactos
        run: |
          mkdir -p build-artifacts
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk "build-artifacts/PadelSanPedro-v${{ env.VERSION_NAME }}-debug.apk"
            cp android/app/build/outputs/apk/debug/app-debug.apk "build-artifacts/PadelSanPedro-latest.apk"
          fi
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "build-artifacts/PadelSanPedro-v${{ env.VERSION_NAME }}-release.aab"
          fi

      - name: 11. Subir APK instalable como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PadelSanPedro-v${{ env.VERSION_NAME }}-APK
          path: build-artifacts/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: 12. Subir Log de Gradle como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-v${{ env.VERSION_NAME }}
          path: gradle_build.log
          if-no-files-found: ignore
          retention-days: 7
