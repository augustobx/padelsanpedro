name: Build Android App (Padel San Pedro)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilación'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'apk_debug'
          - 'bundle_release'
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build-android:
    name: Compilar APK y AAB de Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 4. Instalar dependencias npm
        run: npm ci

      - name: 5. Sincronizar Capacitor Android
        run: npx cap sync android

      - name: 6. Permisos de ejecución para Gradlew
        run: chmod +x android/gradlew

      - name: 7. Compilar APK (Instalable directo para Android)
        id: gradle_build
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../gradle_build.log

      - name: Mostrar log si falla en el resumen
        if: failure()
        run: |
          echo "## ❌ Error de compilación en Gradle" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 100 gradle_build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 8. Compilar AAB (Bundle para Google Play Store)
        run: |
          cd android
          ./gradlew bundleRelease || echo "Release bundle opcional sin firma"

      - name: 9. Preparar artefactos
        run: |
          mkdir -p build-artifacts
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/PadelSanPedro-v1.0-debug.apk
          fi
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab build-artifacts/PadelSanPedro-v1.0-release.aab
          fi

      - name: 10. Subir APK instalable como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PadelSanPedro-Android-APK
          path: build-artifacts/PadelSanPedro-v1.0-debug.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: 11. Subir Log de Gradle como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log
          if-no-files-found: ignore
          retention-days: 7
